[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/gamedata",
    "crates/loadout",
    "crates/plan",
    "crates/scenario",
    "crates/engine",
    "crates/mechanics",
    "crates/env",
    "crates/policy",
    "crates/learn",
    "crates/eval",
    "crates/optimize",
    "crates/export",
    "crates/ingest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mredmond/portunus"

[workspace.dependencies]
portunus-core = { path = "crates/core" }
portunus-gamedata = { path = "crates/gamedata" }
portunus-loadout = { path = "crates/loadout" }
portunus-plan = { path = "crates/plan" }
portunus-scenario = { path = "crates/scenario" }
portunus-engine = { path = "crates/engine" }
portunus-mechanics = { path = "crates/mechanics" }
portunus-env = { path = "crates/env" }
portunus-policy = { path = "crates/policy" }
portunus-learn = { path = "crates/learn" }
portunus-eval = { path = "crates/eval" }
portunus-optimize = { path = "crates/optimize" }
portunus-export = { path = "crates/export" }
portunus-ingest = { path = "crates/ingest" }
postcard = { version = "1", default-features = false, features = ["alloc"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
